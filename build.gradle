buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://plugins.gradle.org/m2' }
    }
    dependencies {
        classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') {
            changing = true
        }
    }
}

apply plugin: 'forge'

version = "2.1.1"
group= "com.ezzo.bobfluidtranslator" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "bobfluidtranslator"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "eclipse"
}

compileJava.options.encoding = 'UTF-8'
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.jFlags('-Dfile.encoding=UTF-8')
}

repositories {
    maven {
        name = "OpenComputers"
        url = "https://maven.cil.li/"
    }
    maven {
        // RetroFuturaGradle
        name = "GTNH Maven"
        url = uri("https://nexus.gtnewhorizons.com/repository/public/")
    }
    maven {
        name = "Jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
    }
    maven {
        name = "OpenComputers"
        url = "https://maven.cil.li/"
    }
    maven {
        name "NTM Releases"
        url "https://maven.ntmr.dev/releases"
    }
    maven {
        name = "ChickenBones"
        url = "https://chickenbones.net/maven/"
    }
}

dependencies {
    implementation("com.hbm:HBM-NTM:1.0.27_X5719:dev") { transitive = false }

    implementation "li.cil.oc:OpenComputers:MC1.7.10-1.5.+:api"

    implementation('com.github.GTNewHorizons:CodeChickenCore:1.4.16:dev')
    implementation('com.github.GTNewHorizons:NotEnoughItems:2.8.105-GTNH:dev') { transitive = false }

}

processResources
{
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }

    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

def modsDir = project.findProperty("modsDir") ?: ""

if (!modsDir.isEmpty()) {
    tasks.register('copyModJar', Copy) {
        from("$buildDir/libs") {
            include "${archivesBaseName}-${version}.jar"
        }
        into modsDir
    }
    build.finalizedBy copyModJar
}

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    classifier = 'sources'
    from sourceSets.main.allSource
}

tasks.register('javadocJar', Jar) {
    dependsOn javadoc
    classifier = 'javadoc'
    from javadoc.destinationDir
}

artifacts {
    archives sourcesJar
    archives javadocJar
}
